plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bankingpj'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 전체 테스트 로그 중 멱등성 관찰 메시지만 터미널에 전달한다.
	onOutput { descriptor, event ->
		if (event.message.contains('[IDEMPOTENCY]')) {
			print event.message
		}
	}
}

// 동시성 통합 테스트의 요청별 진행 상황을 콘솔에서 관찰하기 위한 전용 작업이다.
tasks.register('concurrencyTest', Test) {
	description = 'Runs financial concurrency integration tests with console output.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.bankingpj.backend.account.FinancialConcurrencyIntegrationTest'
	}
	testLogging {
		showStandardStreams = true
	}
}

// 일반 애플리케이션 실행과 분리하여 명시적으로만 성능 테스트 데이터를 생성한다.
def seedScaleProperty = providers.gradleProperty('seedScale')
tasks.register('seedData', JavaExec) {
	group = 'application'
	description = 'Seeds performance test data. Requires -PseedScale=SMALL|MEDIUM|LARGE.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.bankingpj.backend.performance.PerformanceDataSeeder'
	dependsOn tasks.named('classes')
	doFirst {
		if (!seedScaleProperty.isPresent()) {
			throw new GradleException('seedData 실행 시 -PseedScale=SMALL|MEDIUM|LARGE 를 지정하세요.')
		}
		args(seedScaleProperty.get())
	}
}

// bankingpj_perf의 STEP 16 데이터만 명시적으로 초기화한다.
tasks.register('resetSeedData', JavaExec) {
	group = 'application'
	description = 'Resets STEP 16 data only in bankingpj_perf.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.bankingpj.backend.performance.PerformanceDataResetter'
	dependsOn tasks.named('classes')
}
