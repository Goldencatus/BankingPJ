spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# Supply a Base64-encoded random key of at least 32 bytes through the environment.
auth.access-secret=${JWT_ACCESS_SECRET:}
auth.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
auth.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:1209600}
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
